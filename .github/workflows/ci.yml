name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Vendored copy of Script-Augur/packages/.github/actions/setup-script-augur.
      # Public workflows cannot `uses:` actions from another private repo; keep a
      # local copy. Private same-org apps may call the packages action directly.
      # Requires repo secret NPM_TOKEN (PAT with read:packages) — GITHUB_TOKEN
      # cannot install cross-repo GitHub Packages.
      - uses: ./.github/actions/setup-script-augur
        with:
          cache: 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build
